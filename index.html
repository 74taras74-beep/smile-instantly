
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест стрічки — Усмішка Миттєво</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        
        body { 
            font-family: sans-serif; 
            background: #000; 
            color: #fff; 
            overflow: hidden; 
        }
        
        .app-header {
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 60px;
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            padding: 0 20px; 
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            z-index: 10;
        }
        
        .logo { 
            font-size: 20px; 
            font-weight: bold; 
        }
        
        .logo span { 
            color: #fe2c55; 
        }
        
        .btn-upload { 
            background: #fe2c55; 
            color: #fff; 
            border: none; 
            padding: 8px 16px; 
            border-radius: 20px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: background 0.2s;
        }

        .btn-upload:hover {
            background: #e11d43;
        }

        .video-feed { 
            width: 100%; 
            height: 100vh; 
            overflow-y: scroll; 
            scroll-snap-type: y mandatory; 
            scroll-behavior: smooth; 
            -webkit-overflow-scrolling: touch;
        }
        
        .video-card { 
            position: relative; 
            width: 100%; 
            height: 100vh; 
            scroll-snap-align: start; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background: #000; 
        }
        
        .feed-video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }

        .interaction-panel { 
            position: absolute; 
            right: 15px; 
            bottom: 120px; 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
            z-index: 5; 
        }
        
        .action-btn { 
            background: rgba(34, 34, 34, 0.6); 
            border: none; 
            width: 55px; 
            height: 55px; 
            border-radius: 50%; 
            color: white; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            cursor: pointer; 
            backdrop-filter: blur(10px); 
            transition: transform 0.1s;
        }

        .action-btn:active {
            transform: scale(0.9);
        }
        
        .action-btn .icon { 
            font-size: 22px; 
        }
        
        .action-btn .count { 
            font-size: 12px; 
            margin-top: 2px; 
            font-weight: bold; 
        }

        .video-details { 
            position: absolute; 
            left: 15px; 
            bottom: 40px; 
            max-width: 80%; 
            z-index: 5; 
            text-shadow: 1px 1px 5px rgba(0,0,0,0.8); 
        }
        
        .video-details h3 { 
            font-size: 18px; 
            margin-bottom: 5px; 
        }
        
        .video-details p { 
            font-size: 14px; 
            color: #e1e1e1; 
        }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="logo">😊 Усмішка <span>Миттєво</span></div>
        <button class="btn-upload" onclick="openUploadMenu()">+ Додати відео</button>
    </header>

    <main class="video-feed">
        <!-- КАРТКА 1 -->
        <section class="video-card">
            <!-- Шлях до першого файлу у вашій папці комп'ютера / репозиторії -->
            <video class="feed-video" src="video1.mp4" loop playsinline muted></video>
            
            <div class="interaction-panel">
                <button class="action-btn like-btn" data-liked="false">
                    <span class="icon">🤍</span>
                    <span class="count">42</span>
                </button>
                <button class="action-btn mute-btn"><span class="icon">🔇</span></button>
            </div>
            <div class="video-details">
                <h3>@taras_creator</h3>
                <p>Тестуємо швидкість вертикальної стрічки! 🚀🔥</p>
            </div>
        </section>

        <!-- КАРТКА 2 -->
        <section class="video-card">
            <!-- Шлях до другого файлу у вашій папці комп'ютера / репозиторії -->
            <video class="feed-video" src="video2.mp4" loop playsinline muted></video>
            
            <div class="interaction-panel">
                <button class="action-btn like-btn" data-liked="false">
                    <span class="icon">🤍</span>
                    <span class="count">118</span>
                </button>
                <button class="action-btn mute-btn"><span class="icon">🔇</span></button>
            </div>
            <div class="video-details">
                <h3>@user_test</h3>
                <p>Друге тестове відео від підписників з месенджера. Свайпай вгору! 😂</p>
            </div>
        </section>
    </main>

    <script>
        const videos = document.querySelectorAll('.feed-video');
        
        // Автоматичне відтворення поточного відео при скролі
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const video = entry.target;
                if (entry.isIntersecting) {
                    video.play().catch(() => {});
                } else {
                    video.pause();
                    video.currentTime = 0;
                }
            });
        }, { threshold: 0.6 });
        
        videos.forEach(v => observer.observe(v));

        // Обробка кліків по кнопках лайків
        document.querySelectorAll('.like-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const count = btn.querySelector('.count');
                const icon = btn.querySelector('.icon');
                let isLiked = btn.getAttribute('data-liked') === 'true';
                let num = parseInt(count.textContent);
                
                if (!isLiked) {
                    btn.setAttribute('data-liked', 'true');
                    icon.textContent = '❤️';
                    count.textContent = num + 1;
                } else {
                    btn.setAttribute('data-liked', 'false');
                    icon.textContent = '🤍';
                    count.textContent = num - 1;
                }
            });
        });

        // Індивідуальне керування звуком для кожної картки окремо
        document.querySelectorAll('.video-card').forEach(card => {
            const video = card.querySelector('.feed-video');
            const muteBtn = card.querySelector('.mute-btn');
            
            if (video && muteBtn) {
                const icon = muteBtn.querySelector('.icon');
                muteBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    video.muted = !video.muted;
                    icon.textContent = video.muted ? '🔇' : '🔊';
                });
            }
        });

        function openUploadMenu() {
            alert('Зручний тест: надішліть відео адміну в Telegram @ваш_нік для публікації!');
        }
    </script>
</body>
</html>
